# Nginx: deny direct access to Information Room uploads.
# Include inside the server { } block, e.g.:
#   include /path/to/site/assets/uploads/information_room/nginx-deny.conf;
#
# Or paste:
#   location ^~ /assets/uploads/information_room/ {
#       deny all;
#       return 403;
#   }
#
# Apache already uses .htaccess in this folder.
# Files must be served only via /information-room-file.php (auth proxy).

location ^~ /assets/uploads/information_room/ {
    deny all;
    return 403;
}
