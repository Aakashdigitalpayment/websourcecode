# Example nginx server block for this PHP cooperative site (safe defaults).
# Copy and adapt; do NOT commit production secrets here.
#
#   sudo cp deploy/nginx-site.example.conf /etc/nginx/sites-available/coop
#   # edit root / server_name / PHP socket
#   sudo ln -s /etc/nginx/sites-available/coop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    root /var/www/websourcecode;
    index index.php index.html;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Security mirror of Apache .htaccess (required on nginx)
    include /var/www/websourcecode/deploy/nginx-security.conf;

    # Long-cache fingerprinted static assets (mirrors .htaccess Expires/Headers)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pretty URLs: hide .php on GET/HEAD bookmarks (POST to *.php stays put)
    # share-og.php skipped — social crawlers hit it often.
    set $php_strip 0;
    if ($request_method ~ ^(GET|HEAD)$) { set $php_strip 1; }
    if ($uri = /share-og.php) { set $php_strip 0; }
    if ($uri ~ \.php$) { set $php_strip "${php_strip}1"; }
    if ($php_strip = 11) {
        rewrite ^/index\.php$ / permanent;
        rewrite ^/(.+)/index\.php$ /$1/ permanent;
        rewrite ^/(.+)\.php$ /$1 permanent;
    }

    location / {
        # Never use $uri.php as a try_files file target here — nginx would
        # serve raw PHP from this location. Rewrite via named location instead.
        try_files $uri $uri/ @extensionless;
    }

    location @extensionless {
        # /contact → /contact.php then re-dispatch to location ~ \.php$
        rewrite ^/(.*)$ /$1.php last;
    }

    location ~ \.php$ {
        # Missing .php → 404 (do not pass junk to FPM)
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_pass 127.0.0.1:9000;
    }
}
