# Example nginx server block for this PHP cooperative site (safe defaults).
# Copy and adapt; do NOT commit production secrets here.
#
#   sudo cp deploy/nginx-site.example.conf /etc/nginx/sites-available/coop
#   # edit root / server_name / PHP socket
#   sudo ln -s /etc/nginx/sites-available/coop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    root /var/www/websourcecode;
    index index.php index.html;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Security mirror of Apache .htaccess (required on nginx)
    include /var/www/websourcecode/deploy/nginx-security.conf;

    # Long-cache fingerprinted static assets (mirrors .htaccess Expires/Headers)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_pass 127.0.0.1:9000;
    }
}
