# =============================================================================
# Nginx security mirror of Apache .htaccess rules in this repo
# =============================================================================
# Apache .htaccess is IGNORED by nginx. Include this from your server{} block:
#
#   include /var/www/websourcecode/deploy/nginx-security.conf;
#
# Or copy snippets into the live site config. Paths assume the app is at
# document root (https://example.com/). For a subdirectory, prefix locations.
# =============================================================================

# --- Deny private PHP sources / secrets / tooling (root .htaccess) ---
location ^~ /includes/ { deny all; return 403; }
location ^~ /cache/    { deny all; return 403; }
location ^~ /logs/     { deny all; return 403; }
location ^~ /scripts/  { deny all; return 403; }
location ^~ /database/ { deny all; return 403; }
location ^~ /core/     { deny all; return 403; }
location ^~ /deploy/   { deny all; return 403; }
location ^~ /vendor/   { deny all; return 403; }

# Credential / secret filenames
location ~* /(^|/)\.cred { deny all; return 403; }
location ~* \.cred-master\.key$ { deny all; return 403; }
location ~* /\.auth-secret$ { deny all; return 403; }
location ~* /\.env { deny all; return 403; }
location ~* /\.git { deny all; return 403; }
location ~* \.(sql|bak|config|ini)$ { deny all; return 403; }

# Debug stub must never be reachable
location = /member/session-check.php { deny all; return 403; }

# Install wizard — block when locked / local DB config exists
location = /install.php {
    if (-f $document_root/install.lock) { return 403; }
    if (-f $document_root/includes/database.local.php) { return 403; }
}

# Uploads: serve static files only — never execute PHP/scripts; no listing
# (mirrors assets/uploads/.htaccess and per-folder upload .htaccess)
location ^~ /assets/uploads/ {
    autoindex off;
    location ~* \.(?i:php|phtml|php3|php4|php5|php7|php8|phar|cgi|pl|asp|aspx|exe|sh|shtml)$ {
        deny all;
        return 403;
    }
}

# Site-wide: no directory listing
autoindex off;

# --- Pretty/crawler routes from root .htaccess ---
location = /sitemap.xml {
    include fastcgi_params;
    # Prefer rewriting via try_files to sitemap.php in the main PHP location.
    # If your PHP handler is a named location @php, use: rewrite ^ /sitemap.php last;
    rewrite ^ /sitemap.php last;
}
location = /robots.txt {
    rewrite ^ /robots.php last;
}
location = /manifest.json {
    rewrite ^ /manifest.php last;
}
