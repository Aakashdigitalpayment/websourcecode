# Nginx security mirror of root .htaccess (Apache rules do not apply on nginx).
# Include from server block, e.g.:
#   include /path/to/repo/deploy/nginx-security.conf;
#
# Adjust root paths if the app is in a subdirectory.

# Deny private PHP sources / secrets / tooling
location ^~ /includes/ { deny all; return 403; }
location ^~ /cache/    { deny all; return 403; }
location ^~ /logs/     { deny all; return 403; }
location ^~ /scripts/  { deny all; return 403; }
location ^~ /database/ { deny all; return 403; }
location ^~ /core/     { deny all; return 403; }

# Credential / secret filenames
location ~* /(^|/)\.cred { deny all; return 403; }
location ~* \.cred-master\.key$ { deny all; return 403; }
location ~* /\.auth-secret$ { deny all; return 403; }

# Debug stub must never be reachable
location = /member/session-check.php { deny all; return 403; }

# Install wizard — only when unlocked (no install.lock / database.local.php)
location = /install.php {
    if (-f $document_root/install.lock) { return 403; }
    if (-f $document_root/includes/database.local.php) { return 403; }
}

# Uploads: serve files, never execute PHP; no directory listing
location ^~ /assets/uploads/ {
    autoindex off;
    location ~* \.php$ { deny all; return 403; }
}

# Site-wide: no autoindex
autoindex off;
